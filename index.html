<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做题数据同步</title>
    <style>
        /* 样式省略，你可以沿用原来的样式，我这里只给核心逻辑 */
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .sync-bar { padding: 8px; background: #eee; text-align: center; border-radius: 8px; margin-bottom: 16px; }
        .sync-bar.online { background: #c8e6c9; color: #2e7d32; }
        .sync-bar.offline { background: #ffccbc; color: #bf360c; }
        .card { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
        input, select, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        .btn-primary { background: #2196F3; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 20px; border-radius: 20px; display: none; }
        .toast.show { display: block; }
    </style>
</head>
<body>

<div class="sync-bar" id="syncBar">⏳ 同步中...</div>

<div class="card">
    <h2>📝 新增做题记录</h2>
    <select id="quizCat"><option>图推</option><option>逻辑</option></select>
    <input type="text" id="quizChapter" placeholder="章节名，如：第一节">
    <div style="display:flex; gap:8px;">
        <input type="text" id="myAns" placeholder="我的选项 (A-D)" maxlength="2" style="width:30%">
        <input type="text" id="correctAns" placeholder="正确答案 (A-D)" maxlength="2" style="width:30%">
        <button id="saveBtn" style="width:40%;">保存</button>
    </div>
    <div id="inputStats" style="margin-top:8px; font-size:14px;"></div>
</div>

<div class="card">
    <h2>📊 已保存的记录</h2>
    <div id="recordList">暂无数据</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  🔑 配置区 - 填入你的 JSONBin 信息
// ============================================================
const JSONBIN_BIN_ID = '6a803a9bda38895dfee7e4f6';       // 如：5f8a9b...
const JSONBIN_API_KEY = '$2a$10$Ix.1G7lvtweKGC5cZHyXoe41OVhXMiRtp.Eq05dcmcZWW5pF8abe6';     // 如：$2a$10$...

// ============================================================
//  📦 数据存储层
// ============================================================
var LS_KEY = 'wb_data';

function setSyncState(state, text) {
    var bar = document.getElementById('syncBar');
    bar.className = 'sync-bar ' + state;
    bar.textContent = text || (state === 'online' ? '✅ 已连接' : state === 'offline' ? '⚠️ 离线' : '⏳ 同步中...');
}

function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) { return []; } }
function lsSet(data) { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {} }

var DataStore = {
    cache: [],

    load: function() {
        var self = this;
        setSyncState('syncing', '正在加载...');
        var url = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`;

        return fetch(url, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        })
        .then(res => {
            if (!res.ok) throw new Error('加载失败 ' + res.status);
            return res.json();
        })
        .then(data => {
            self.cache = data.record || [];
            lsSet(self.cache);
            setSyncState('online', '✅ 已同步');
            return self.cache;
        })
        .catch(err => {
            console.warn('加载失败，使用本地缓存:', err);
            self.cache = lsGet();
            setSyncState('offline', '⚠️ 离线模式');
            return self.cache;
        });
    },

    save: function() {
        var self = this;
        setSyncState('syncing', '正在保存...');
        var url = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
        return fetch(url, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify(self.cache)
        })
        .then(res => {
            if (!res.ok) throw new Error('保存失败 ' + res.status);
            lsSet(self.cache);
            setSyncState('online', '✅ 已保存');
            return true;
        })
        .catch(err => {
            console.error('保存失败:', err);
            lsSet(self.cache);
            setSyncState('offline', '⚠️ 保存失败，已存本地');
            return false;
        });
    },

    add: function(item) {
        item._id = Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        this.cache.push(item);
        return this.save();
    },

    getAll: function() { return this.cache; }
};

// ============================================================
//  🖥️ 界面逻辑
// ============================================================
function renderRecords() {
    var list = document.getElementById('recordList');
    var records = DataStore.getAll();
    if (records.length === 0) {
        list.innerHTML = '暂无记录';
        return;
    }
    var html = '';
    records.forEach(r => {
        html += `<div style="border-bottom:1px solid #eee; padding:6px 0;">
            <strong>${r.subject} / ${r.chapter}</strong><br>
            第${r.qno}题：我的答案 ${r.myAns}，正确答案 ${r.correctAns} → ${r.myAns === r.correctAns ? '✅ 对' : '❌ 错'}
        </div>`;
    });
    list.innerHTML = html;
}

function saveRecord() {
    var cat = document.getElementById('quizCat').value;
    var chapter = document.getElementById('quizChapter').value.trim();
    var myAns = document.getElementById('myAns').value.toUpperCase().replace(/[^A-D]/g, '');
    var correctAns = document.getElementById('correctAns').value.toUpperCase().replace(/[^A-D]/g, '');

    if (!chapter) { toast('请输入章节名'); return; }
    if (!myAns || !correctAns) { toast('请填写选项和答案'); return; }

    var qno = DataStore.getAll().filter(r => r.subject === cat && r.chapter === chapter).length + 1;

    var item = {
        subject: cat,
        chapter: chapter,
        qno: qno,
        myAns: myAns,
        correctAns: correctAns,
        isCorrect: myAns === correctAns
    };

    DataStore.add(item).then(() => {
        toast('✅ 保存成功');
        document.getElementById('myAns').value = '';
        document.getElementById('correctAns').value = '';
        renderRecords();
        updateStats();
    });
}

function updateStats() {
    var records = DataStore.getAll();
    var total = records.length;
    var correct = records.filter(r => r.isCorrect).length;
    var rate = total > 0 ? Math.round(correct / total * 100) : 0;
    document.getElementById('inputStats').textContent = `总题数：${total}，正确：${correct}，正确率：${rate}%`;
}

// ============================================================
//  🚀 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    DataStore.load().then(() => {
        renderRecords();
        updateStats();
    });

    document.getElementById('saveBtn').addEventListener('click', saveRecord);
});

// 每30秒自动同步一次（可选）
setInterval(() => {
    if (navigator.onLine) {
        DataStore.load().then(() => {
            renderRecords();
            updateStats();
        });
    }
}, 30000);
</script>
</body>
</html>
